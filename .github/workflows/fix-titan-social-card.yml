name: Fix Titan social card

on:
  push:
    paths:
      - '.github/workflows/fix-titan-social-card.yml'
      - '.github/scripts/fix_titan_social_card.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-social-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate social card and update metadata
        run: python .github/scripts/fix_titan_social_card.py

      - name: Commit generated PNG and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add titan.html titan-article-og.png
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix Titan social preview image'
            git push
          fi
